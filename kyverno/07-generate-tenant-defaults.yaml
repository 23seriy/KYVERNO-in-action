# New franchise setup — when a namespace appears with a `tenant=*` label,
# Kyverno generates the baseline tenants always forget to ship:
#   - default-deny NetworkPolicy
#   - ResourceQuota
#   - LimitRange
#
# Synchronize: true means Kyverno also reconciles drift — if a tenant edits
# the generated NetworkPolicy, Kyverno reverts it back to the source spec.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-tenant-defaults
  annotations:
    policies.kyverno.io/title: Generate tenant baseline (NP + Quota + LR)
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      For every namespace labelled `tenant=<name>`, generate a default-deny
      NetworkPolicy, a ResourceQuota, and a LimitRange so tenants land with
      sensible defaults instead of an empty playing field.
spec:
  background: false
  rules:
    - name: generate-default-deny-netpol
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - key: tenant
                    operator: Exists
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          metadata:
            labels:
              generated-by: kyverno
              tenant: "{{request.object.metadata.labels.tenant}}"
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
    - name: generate-resource-quota
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - key: tenant
                    operator: Exists
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: tenant-quota
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          metadata:
            labels:
              generated-by: kyverno
              tenant: "{{request.object.metadata.labels.tenant}}"
          spec:
            hard:
              requests.cpu: "2"
              requests.memory: "4Gi"
              limits.cpu: "4"
              limits.memory: "8Gi"
              pods: "20"
    - name: generate-limit-range
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - key: tenant
                    operator: Exists
      generate:
        apiVersion: v1
        kind: LimitRange
        name: tenant-limits
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          metadata:
            labels:
              generated-by: kyverno
              tenant: "{{request.object.metadata.labels.tenant}}"
          spec:
            limits:
              - type: Container
                default:
                  cpu: 200m
                  memory: 256Mi
                defaultRequest:
                  cpu: 50m
                  memory: 64Mi
                max:
                  cpu: "1"
                  memory: 512Mi
