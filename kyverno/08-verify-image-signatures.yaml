# Player ID check — only images signed by our trusted Cosign key are
# allowed to run.
#
# The public key below is the *placeholder* generated by
# scripts/03-deploy-app.sh (it overwrites this file with the real key before
# applying). The script signs team-stats-api with the matching private key
# and deliberately leaves trash-talk-bot unsigned so the rogue pod in
# scenario 8 gets rejected.
#
# In production you'd use keyless signing (Fulcio + Rekor) and reference an
# OIDC identity instead — same policy shape, just `keyless:` instead of
# `key:`.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify image signatures (Cosign)
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Reject any image that isn't signed by the trusted Cosign key. This is
      Kyverno's `verifyImages` rule — it intercepts admission, fetches the
      signature from the OCI registry, and verifies it before letting the
      pod through.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: verify-team-stats-api-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [kyverno-demo, "tenant-*"]
      verifyImages:
        - imageReferences:
            - "localhost:5000/team-stats-api:*"
            - "localhost:5000/trash-talk-bot:*"
          mutateDigest: true
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      PLACEHOLDER_REPLACED_BY_scripts_03-deploy-app.sh
                      -----END PUBLIC KEY-----
                    rekor:
                      ignoreTlog: true
